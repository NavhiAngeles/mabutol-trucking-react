name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    env:
      CI: "true"
      VITE_SUPABASE_URL: "https://placeholder-project.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
      VITE_MAPTILER_API_KEY: "placeholder-maptiler-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Run build
        run: npm run build

